<!DOCTYPE html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8">
    <link rel="icon" href="/favicon.ico">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TGB Resolver</title>
    <script>
      // Run BEFORE any CSS: Chakra Panda preset semantic tokens need
      // html[class="light"|"dark"] at first paint — no FOUC, no flash.
      (() => {
        var mode = null;
        try {
          mode = localStorage.getItem("color-mode");
        } catch {}
        var root = document.documentElement;
        if (mode === "light") root.classList.remove("dark");
        else if (mode === "dark") root.classList.add("dark");
        if (mode !== "light" && mode !== "dark") root.classList.add("dark");
      })();
    </script>
  </head>
  <body>
    <div id="app">
      <!-- Static splash: shown until Vue mounts (#app content replaced) -->
      <div id="splash">
        <img id="splash-logo" src="/logo.png" alt="TGB Resolver" width="128" height="128" />
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
